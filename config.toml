[search]
# A job is kept if its title contains ANY of these (case-insensitive).
title_include = [
    "data analyst", "data scientist", "data science", "analytics", "machine learning",
    "ml engineer", "statistician", "biostatistic", "business intelligence", "quantitative analyst",
    "research analyst", "product analyst", "insights analyst", "reporting analyst", "healthcare analyst",
    "clinical data analyst", "clinical data scien", "clinical data manag", "health data", "bioinformatic",
    "computational biolog", "decision scien", "statistical programmer", "applied scientist", "ai engineer",
    "data associate",
    # Data science titles specific to health care / life sciences
    "epidemiolog", "outcomes research", "health economic", "real world", "real-world", "quantitative scientist",
    "clinical informatic", "health informatic",
]
# ...and NONE of these.
title_exclude = [
    "senior", "sr.", "sr", "staff", "principal", "lead", "director", "manager",
    "head of", "vp", "intern", "leader", "iii", "iv",
]
# Phrases that contain an excluded word but aren't about seniority; they're ignored
# when checking title_exclude (e.g. "Lead Generation Analyst" is kept).
title_exclude_exceptions = ["lead generation"]
# Location must contain ANY of these. Leave empty to accept every location.
locations = [
    # Remote
    "remote",
    # San Francisco Bay Area
    "san jose", "santa clara", "sunnyvale", "mountain view", "palo alto", "menlo park",
    "redwood city", "san mateo", "foster city", "south san francisco", "san francisco",
    "bay area", "fremont", "oakland", "emeryville", "berkeley", "hayward", "milpitas",
    "cupertino", "los gatos", "san carlos", "brisbane", "burlingame", "pleasanton",
    # Austin, TX
    "austin",
]
# ...and NONE of these (drops remote roles based outside the US).
location_exclude = [
    "india", "united kingdom", "london", "spain", "barcelona", "germany", "berlin", "france", "paris",
    "denmark", "copenhagen", "ireland", "netherlands", "portugal", "poland", "europe", "emea",
    "canada", "toronto", "vancouver", "mexico", "brazil", "argentina", "colombia", "costa rica", "latam",
    "australia", "singapore", "japan", "israel", "philippines", "apac",
    "slovakia", "czech", "hungary", "romania", "bulgaria", "serbia", "croatia", "ukraine", "italy", "milan",
    "sweden", "norway", "finland", "switzerland", "zurich", "belgium", "austria", "greece", "turkey",
    "china", "shanghai", "beijing", "hong kong", "korea", "seoul", "taiwan", "vietnam", "malaysia",
    "indonesia", "thailand", "new zealand", "south africa", "egypt", "dubai", "united arab emirates",
    "saudi arabia", "chile", "peru", "uruguay",
]

# Free checks of the posting text before paying to score it.
# Jobs whose required experience is above this many years are skipped. Separate requirement lines
# all apply; alternatives on one line ("BS + 3 years or MS + 1 year") use the lowest number.
max_years_required = 3
# Skip jobs that require a PhD with no Master's/Bachelor's alternative.
exclude_phd_required = true

[profile]
resume_path = "master_resume.md"              # content: source of truth for facts
resume_tex_path = "ThiGiang_Resume_Master.tex"  # layout: used to build tailored PDFs
facts_path = "verified_supplemental_facts.md"   # confirmed facts not yet on the resume
# Free-text preferences the scorer should weigh (seniority, salary floor, visa, etc.).
preferences = """
- Target roles: data analyst, data scientist, or machine learning roles.
- Top priority: data scientist roles (including applied/ML scientist, biostatistician, real-world-evidence
  and outcomes research) at health tech / medical / biotech companies. Data analyst and ML engineer roles
  at those companies are also wanted. Roles outside health care are a lower priority.
- Seeking entry-level to early-career roles; MS in Statistics, May 2023.
- Experience summary: about 1 year of research experience (Research Assistant, Aug 2024 - June 2025).
  Projects and coursework show skills, not years of experience.
- Based in San Jose, CA. Preferred locations: San Francisco Bay Area, Austin TX, or remote
  (only remote roles open to someone living in California).
"""

# [applicant] details (name, email, phone, ...) live in personal.toml, which Git ignores.
# See personal.example.toml.

[scoring]
prompt_path = "prompts/job_matching_master_prompt.md"
model = "claude-opus-5-5"
effort = "low"       # low | medium | high — low is plenty for fit scoring
min_score = 70       # jobs at or above this show up in `list` by default

[tailoring]
prompt_path = "prompts/resume_tailoring_master_prompt.md"
config_path = "prompts/resume_tailoring_config.md"
audit_prompt_path = "prompts/resume_auditor_prompt.md"
model = "claude-opus-5-5"
audit_model = "claude-opus-5-5"
effort = "medium"     # tailoring needs more care than scoring
page_limit = 1
max_revisions = 2     # extra rounds when edits fail checks or the resume runs over the page limit
output_dir = "tailored"
file_prefix = "ThiGiang_Resume"   # files are named <prefix>_<Industry>_<Company>_<Role>
